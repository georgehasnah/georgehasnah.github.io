<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>George Hasnah</title>
  <style>
    :root {
      --navy: #0b1f3a;
      --text: #f4f6fa;
      --muted: #a9b6cc;
      --line: rgba(255, 255, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--navy);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      text-align: center;
      padding: max(48px, env(safe-area-inset-top)) 16px max(48px, env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 2rem; font-weight: 600; letter-spacing: 0.5px; }
    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    section { padding: 28px 0; }
    hr { border: 0; border-top: 1px solid var(--line); width: 60%; margin: 0 auto; }
    ul { list-style: none; }
    li { margin: 4px 0; }
    .sub { color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>George Hasnah</h1>
      <p class="sub">Senior at Stanford University</p>
    </section>

    <hr>

    <section>
      <h2>Major</h2>
      <p>Political Science</p>
    </section>

    <hr>

    <section>
      <h2>Interests</h2>
      <ul>
        <li>Development Economics</li>
        <li>Sustainability</li>
      </ul>
    </section>

    <hr>

    <section>
      <h2>Projects</h2>
      <ul>
        <li>Project one</li>
        <li>Project two</li>
      </ul>
    </section>
  </main>
</body>
</html>
